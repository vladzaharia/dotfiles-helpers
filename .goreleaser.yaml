version: 2

builds:
  - id: agent-helper
    binary: agent-helper
    main: ./cmd/agent-helper
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/vladzaharia/dotfiles-helpers/agent/cmd.version={{.Version}}

  - id: vault-helper
    binary: vault-helper
    main: ./cmd/vault-helper
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w

  - id: sops-helper
    binary: sops-helper
    main: ./cmd/sops-helper
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w

archives:
  - id: agent-helper
    ids: [agent-helper]
    name_template: "agent-helper_{{ .Os }}_{{ .Arch }}"
  - id: vault-helper
    ids: [vault-helper]
    name_template: "vault-helper_{{ .Os }}_{{ .Arch }}"
  - id: sops-helper
    ids: [sops-helper]
    name_template: "sops-helper_{{ .Os }}_{{ .Arch }}"

homebrew_casks:
  - name: agent-helper
    ids: [agent-helper]
    binaries: [agent-helper]
    repository:
      owner: vladzaharia
      name: homebrew-tap
    homepage: https://github.com/vladzaharia/dotfiles-helpers
    description: "Unified AI coding agent dispatcher"
    custom_block: |
      binary "#{staged_path}/agent-helper", target: "ag"
    hooks:
      post:
        install: |
          system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/agent-helper"]

  - name: vault-helper
    ids: [vault-helper]
    binaries: [vault-helper]
    repository:
      owner: vladzaharia
      name: homebrew-tap
    homepage: https://github.com/vladzaharia/dotfiles-helpers
    description: "HashiCorp Vault CLI helper (SSH certs, TOTP, env injection)"
    custom_block: |
      %w[vh vlogin vssh vmosh votp vtoken vnv vdocker].each do |a|
        binary "#{staged_path}/vault-helper", target: a
      end
    hooks:
      post:
        install: |
          system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/vault-helper"]

  - name: sops-helper
    ids: [sops-helper]
    binaries: [sops-helper]
    repository:
      owner: vladzaharia
      name: homebrew-tap
    homepage: https://github.com/vladzaharia/dotfiles-helpers
    description: "SOPS encryption/decryption CLI with glob support"
    custom_block: |
      binary "#{staged_path}/sops-helper", target: "crypto"
    hooks:
      post:
        install: |
          system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/sops-helper"]

nfpms:
  - id: agent-helper
    package_name: agent-helper
    ids: [agent-helper]
    maintainer: Vlad Zaharia <accounts@vlad.gg>
    formats: [deb, rpm]
    contents:
      - src: agent-helper
        dst: /usr/local/bin/ag
        type: symlink
  - id: vault-helper
    package_name: vault-helper
    ids: [vault-helper]
    maintainer: Vlad Zaharia <accounts@vlad.gg>
    formats: [deb, rpm]
  - id: sops-helper
    package_name: sops-helper
    ids: [sops-helper]
    maintainer: Vlad Zaharia <accounts@vlad.gg>
    formats: [deb, rpm]

release:
  github:
    owner: vladzaharia
    name: dotfiles-helpers
